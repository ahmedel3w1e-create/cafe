<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقة الولاء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7efe6;--card:#fff;--ink:#3b2a20;--mut:#8a7565;--br:#6f4e37;--ac:#c98a4b;--ok:#2e7d4f;--bad:#b3392f}
@media(prefers-color-scheme:dark){:root{--bg:#1f1611;--card:#2c211a;--ink:#f3e8dc;--mut:#b5a191;--br:#d9a66b;--ac:#c98a4b}}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding:16px;max-width:520px;margin-inline:auto}
h1,h2,h3{margin:.3em 0}
.card{background:var(--card);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 6px 20px #0002}
.hero{text-align:center;padding:30px 10px}.hero .e{font-size:64px}
input{width:100%;padding:13px;border:1.5px solid #8a756555;border-radius:12px;margin:6px 0;font:inherit;background:transparent;color:inherit}
button,.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--br);color:#fff;cursor:pointer;text-decoration:none;margin:4px 2px}
button.s,.btn.s{background:transparent;color:var(--br);border:1.5px solid var(--br)}
.wa{background:#25a244}.bad{background:var(--bad)}.full{width:100%}
.loy{background:linear-gradient(135deg,#6f4e37,#c98a4b);color:#fff;text-align:center}
.loy .q{background:#fff;border-radius:14px;padding:10px;display:inline-block;margin-top:10px}
.loy .q svg{width:170px;height:170px;display:block}
.bar{height:16px;background:#fff3;border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:#ffe3b8;border-radius:9px;transition:width .5s}
.stamps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.stamps b{width:34px;height:34px;border-radius:50%;background:#fff3;display:grid;place-items:center}
.stamps b.on{background:#ffe3b8}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #8a756533;align-items:center}
.mut{color:var(--mut);font-size:14px}.err{color:var(--bad);font-weight:600}
.tabs{display:flex;gap:6px}.tabs button{flex:1}
#reader{width:100%;border-radius:12px;overflow:hidden}
.pts{display:flex;flex-wrap:wrap}
@media print{body>*:not(#printarea){display:none}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
/* ===== الإعدادات: عدّل هذا الجزء فقط ===== */
const CONFIG = {
  SUPABASE_URL: "https://mougepmwodtkcdhvxojc.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_02ZweEM749U9nNFAZdMiKA_TBNQSza3",
  CAFE_NAME: "كافيه الرحيق",
  ADMIN_WA: "01000000000",   // رقم واتساب صاحب الكافيه
  GOAL: 10,                  // عدد النقاط/الأختام للحصول على مكافأة
  REWARD: "مشروب مجاني"
};
/* ========================================= */
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let timer = null, scanner = null;

// تنسيق الأرقام المصرية: 01xxxxxxxxx -> 201xxxxxxxxx
function normPhone(p) {
  let d = String(p).replace(/\D/g, "");
  if (d.startsWith("0020")) d = d.slice(2);
  if (d.startsWith("01")) d = "20" + d.slice(1);
  if (d.length === 10 && d.startsWith("1")) d = "20" + d;
  return d;
}
const validPhone = d => /^201[0125]\d{8}$/.test(d);
const wa = (phone, text) => `https://wa.me/${normPhone(phone)}?text=${encodeURIComponent(text)}`;
const qrSvg = t => { const q = qrcode(0, "M"); q.addData(t); q.make(); return q.createSvgTag(6, 0); };
const fmt = d => new Date(d).toLocaleString("ar-EG", {dateStyle: "medium", timeStyle: "short"});
const baseUrl = () => location.href.split("#")[0];

const msgs = {
  welcome: c => `أهلاً ${c.name} 🌟\nتم تسجيلك في بطاقة ولاء ${CONFIG.CAFE_NAME} ☕\nرصيدك الحالي: ${c.points} من ${CONFIG.GOAL}\nبطاقتك: ${baseUrl()}`,
  reward: c => `مبروك ${c.name} 🎉\nوصلت لمكافأتك في ${CONFIG.CAFE_NAME}: ${CONFIG.REWARD} ☕🎁\nنتشرف بزيارتك!`,
  redeemed: c => `تم استبدال مكافأتك (${CONFIG.REWARD}) 🎁 يا ${c.name}\nرصيدك الآن: ${c.points}. بالهنا والشفا ☕`,
  remind: c => `أهلاً ${c.name} ☕\nرصيدك في ${CONFIG.CAFE_NAME}: ${c.points} من ${CONFIG.GOAL}. ننتظر زيارتك!`,
  toAdmin: (c, ev) => `${ev}\nالاسم: ${c.name}\nالهاتف: ${c.phone}\nالرصيد: ${c.points}`
};

function route() {
  clearInterval(timer); stopScan();
  location.hash.startsWith("#/admin") ? adminView() : customerView();
}
addEventListener("hashchange", route);

/* ================= العميل ================= */
async function customerView() {
  const id = localStorage.getItem("cid");
  if (id) return showCard(id);
  welcome();
}
function welcome(tab = "reg") {
  app.innerHTML = `
  <div class="card hero"><div class="e">☕</div><h1>أهلاً بك في ${esc(CONFIG.CAFE_NAME)}</h1>
  <p class="mut">اجمع ${CONFIG.GOAL} نقاط واحصل على ${esc(CONFIG.REWARD)}</p></div>
  <div class="card">
    <div class="tabs"><button class="${tab=="reg"?"":"s"}" id="t1">عميل جديد</button><button class="${tab=="log"?"":"s"}" id="t2">لدي بطاقة</button></div>
    ${tab=="reg" ? `<input id="n" placeholder="الاسم"><input id="p" type="tel" placeholder="رقم الهاتف (01xxxxxxxxx)"><label class="mut">تاريخ الميلاد (اختياري)</label><input id="b" type="date">`
    : `<input id="p" type="tel" placeholder="رقم الهاتف">`}
    <div id="e" class="err"></div>
    <button class="full" id="go">${tab=="reg"?"سجّل الآن":"دخول"}</button>
  </div>`;
  $("#t1").onclick = () => welcome("reg"); $("#t2").onclick = () => welcome("log");
  $("#go").onclick = async () => {
    const phone = normPhone($("#p").value);
    if (!validPhone(phone)) return $("#e").textContent = "رقم الهاتف غير صحيح";
    $("#go").disabled = true;
    if (tab == "reg") {
      const name = $("#n").value.trim();
      if (name.length < 2) { $("#go").disabled = false; return $("#e").textContent = "اكتب اسمك"; }
      const { data, error } = await sb.rpc("register_customer", { p_name: name, p_phone: phone, p_birthday: $("#b").value || null });
      if (error) { $("#go").disabled = false; return $("#e").textContent = error.message.includes("exists") ? "هذا الرقم مسجل بالفعل، اختر (لدي بطاقة)" : "حدث خطأ، حاول مجدداً"; }
      localStorage.setItem("cid", data.id); showCard(data.id, true);
    } else {
      const { data } = await sb.rpc("get_customer", { p_phone: phone });
      if (!data) { $("#go").disabled = false; return $("#e").textContent = "لا توجد بطاقة بهذا الرقم"; }
      localStorage.setItem("cid", data.c.id); showCard(data.c.id);
    }
  };
}
async function showCard(id, isNew) {
  const draw = async () => {
    const { data } = await sb.rpc("get_customer", { p_id: id });
    if (!data) { localStorage.removeItem("cid"); return welcome(); }
    const c = data.c, got = c.points >= CONFIG.GOAL, pc = Math.min(100, c.points / CONFIG.GOAL * 100);
    const st = Array.from({length: CONFIG.GOAL}, (_, i) => `<b class="${i < c.points ? "on" : ""}">${i < c.points ? "☕" : i + 1}</b>`).join("");
    app.innerHTML = `
    <div class="card loy"><h3>${esc(CONFIG.CAFE_NAME)}</h3><h2>${esc(c.name)}</h2>
      <div style="font-size:42px;font-weight:800">${c.points}<small style="font-size:18px"> / ${CONFIG.GOAL}</small></div>
      <div class="bar"><i style="width:${pc}%"></i></div><div class="stamps">${st}</div>
      <p>${got ? "🎉 مكافأتك جاهزة: " + esc(CONFIG.REWARD) : `باقي ${CONFIG.GOAL - c.points} للمكافأة القادمة`}</p>
      <div class="q">${qrSvg(c.id)}</div><p style="font-size:13px;opacity:.9">أظهر الكود للكاشير</p></div>
    ${isNew ? `<div class="card"><b>تم التسجيل بنجاح ✅</b><br><a class="btn wa" target="_blank" href="${wa(CONFIG.ADMIN_WA, msgs.toAdmin(c, "🆕 عميل جديد"))}">أبلغ الكافيه عبر واتساب</a></div>` : ""}
    <div class="card"><h3>🎁 المكافآت</h3><div class="row"><span>${esc(CONFIG.REWARD)}</span><span class="mut">${CONFIG.GOAL} نقاط</span></div>
      ${got ? `<a class="btn wa full" target="_blank" href="${wa(CONFIG.ADMIN_WA, msgs.toAdmin(c, "🎁 أريد استبدال المكافأة"))}">اطلب الاستبدال عبر واتساب</a>` : ""}</div>
    <div class="card"><h3>🕘 سجل الزيارات</h3>${data.v.length ? data.v.map(v => `<div class="row"><span>${v.kind == "redeem" ? "استبدال مكافأة" : "زيارة"}</span><span class="${v.delta < 0 ? "err" : ""}">${v.delta > 0 ? "+" : ""}${v.delta}</span><span class="mut">${fmt(v.created_at)}</span></div>`).join("") : `<p class="mut">لا توجد زيارات بعد</p>`}</div>
    <button class="s full" id="out">تسجيل الخروج</button>`;
    $("#out").onclick = () => { localStorage.removeItem("cid"); welcome(); };
  };
  await draw();
  timer = setInterval(() => { isNew = false; draw(); }, 6000); // تحديث تلقائي
}

/* ================= الإدارة ================= */
const pass = () => sessionStorage.getItem("ap");
function adminView() {
  if (!pass()) {
    app.innerHTML = `<div class="card"><h2>🔐 لوحة الإدارة</h2><input id="pw" type="password" placeholder="كلمة المرور"><div id="e" class="err"></div><button class="full" id="go">دخول</button></div>`;
    $("#go").onclick = async () => {
      const { error } = await sb.rpc("admin_list", { p_pass: $("#pw").value });
      if (error) return $("#e").textContent = "كلمة المرور خاطئة";
      sessionStorage.setItem("ap", $("#pw").value); adminView();
    };
    return;
  }
  app.innerHTML = `
  <h2>☕ لوحة الكاشير</h2>
  <div class="card"><h3>مسح / بحث</h3>
    <button id="scan">📷 افتح الكاميرا</button><div id="reader"></div>
    <input id="q" placeholder="رقم الهاتف أو المعرف"><button class="full" id="find">بحث</button>
    <div id="e" class="err"></div><div id="cust"></div></div>
  <div class="card"><h3>🆕 آخر التسجيلات (مباشر)</h3><div id="list"></div></div>
  <div class="card" id="printarea"><h3>QR الخاص بالمكان</h3><div style="text-align:center"><div style="background:#fff;display:inline-block;padding:10px;border-radius:12px"><div style="width:200px">${qrSvg(baseUrl())}</div></div><p class="mut">${esc(baseUrl())}</p></div>
    <button onclick="print()" class="full">🖨️ طباعة</button></div>
  <button class="s full" id="out">خروج</button>`;
  $("#out").onclick = () => { sessionStorage.removeItem("ap"); adminView(); };
  $("#find").onclick = () => lookup($("#q").value);
  $("#scan").onclick = startScan;
  loadList(); timer = setInterval(loadList, 4000);
}
async function loadList() {
  const { data, error } = await sb.rpc("admin_list", { p_pass: pass() });
  if (error || !$("#list")) return;
  $("#list").innerHTML = data.map(c => `<div class="row"><span><b>${esc(c.name)}</b><br><span class="mut">${esc(c.phone)} · ${c.points} نقطة · ${fmt(c.created_at)}</span></span>
    <span><button class="s" data-id="${c.id}">فتح</button><a class="btn wa" target="_blank" href="${wa(c.phone, msgs.welcome(c))}">واتساب</a></span></div>`).join("") || `<p class="mut">لا يوجد عملاء</p>`;
  document.querySelectorAll("#list [data-id]").forEach(b => b.onclick = () => { lookup(b.dataset.id); scrollTo(0, 0); });
}
async function lookup(q) {
  q = q.trim(); if (!q) return;
  const key = /^[0-9a-f-]{36}$/i.test(q) ? q : normPhone(q);
  const { data } = await sb.rpc("admin_find", { p_pass: pass(), p_q: key });
  if (!data) { $("#cust").innerHTML = ""; return $("#e").textContent = "لم يتم العثور على العميل"; }
  $("#e").textContent = ""; showCust(data);
}
function showCust(c) {
  const got = c.points >= CONFIG.GOAL;
  $("#cust").innerHTML = `<div class="card" style="border:2px solid var(--ac)"><h3>${esc(c.name)}</h3><div class="mut">${esc(c.phone)}</div>
    <div style="font-size:34px;font-weight:800">${c.points} <small>/ ${CONFIG.GOAL}</small></div>
    ${got ? `<b style="color:var(--ok)">🎉 مؤهل للمكافأة</b>` : ""}
    <div class="pts"><button data-d="1">+1</button><button data-d="2">+2</button><button data-d="5">+5</button>
    <button class="bad" data-d="-1">-1</button>
    ${got ? `<button class="bad" data-r="1">استبدال المكافأة (-${CONFIG.GOAL})</button>` : ""}</div>
    <hr><a class="btn wa" target="_blank" href="${wa(c.phone, msgs.remind(c))}">تذكير بالرصيد</a>
    ${got ? `<a class="btn wa" target="_blank" href="${wa(c.phone, msgs.reward(c))}">تهنئة بالمكافأة</a>` : ""}
    <a class="btn wa" target="_blank" href="${wa(CONFIG.ADMIN_WA, msgs.toAdmin(c, "📋 ملخص عميل"))}">ملخص للإدارة</a></div>`;
  document.querySelectorAll("#cust [data-d]").forEach(b => b.onclick = () => change(c, +b.dataset.d, "add"));
  const r = $("#cust [data-r]"); if (r) r.onclick = () => change(c, -CONFIG.GOAL, "redeem");
}
async function change(c, d, kind) {
  const { data, error } = await sb.rpc("admin_add", { p_pass: pass(), p_id: c.id, p_delta: d, p_kind: kind });
  if (error) return $("#e").textContent = "فشلت العملية";
  showCust(data); loadList();
  if (kind == "redeem") $("#cust").insertAdjacentHTML("beforeend", `<a class="btn wa full" target="_blank" href="${wa(data.phone, msgs.redeemed(data))}">أرسل تأكيد الاستبدال للعميل</a><a class="btn wa full" target="_blank" href="${wa(CONFIG.ADMIN_WA, msgs.toAdmin(data, "🎁 تم استبدال مكافأة"))}">إشعار الإدارة</a>`);
}
function startScan() {
  stopScan();
  scanner = new Html5Qrcode("reader");
  scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 220 }, txt => { stopScan(); $("#q").value = txt; lookup(txt); }, () => {})
    .catch(() => $("#e").textContent = "تعذر تشغيل الكاميرا (تأكد من الإذن وأن الموقع HTTPS)");
}
function stopScan() { if (scanner) { scanner.stop().catch(() => {}); scanner = null; } }

route();
</script>
</body>
</html>
